apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      containers:
      - name: kube-rbac-proxy
        $patch: delete
      - name: manager
        args:
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8443
        - --metrics-cert-path=/etc/metrics-certs
        - --leader-elect
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        volumeMounts:
        - name: metrics-certs
          mountPath: /etc/metrics-certs
          readOnly: true
      volumes:
      - name: metrics-certs
        secret:
          secretName: ogx-k8s-operator-controller-manager-metrics-service-tls
          optional: false
